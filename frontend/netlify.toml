# Netlify. Set Base directory to `frontend` in the site settings.
[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Vite inlines these at build time, so they must exist for the BUILD, not runtime.
[build.environment]
  VITE_API_BASE = "https://15-252-140-30.sslip.io/api/v1"
  VITE_WS_URL   = "wss://15-252-140-30.sslip.io/api/v1/ws"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
